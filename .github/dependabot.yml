version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        # Majors arrive as separate PRs so one breaking bump cannot block the rest.
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint (peer: typescript <6.1.0) refuses to load on TS 7.
      # Remove once typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
